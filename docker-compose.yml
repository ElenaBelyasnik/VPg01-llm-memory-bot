services:
  # Stateless bot: no conversation history is kept between messages.
  bot-nomemory:
    build: .
    env_file:
      - .env
    environment:
      USE_MEMORY: "False"
    restart: unless-stopped
    networks:
      - telegram-bots-network

  # Bot with long-term per-user memory stored in SQLite (bot_memory.db).
  # Its own token comes from BOT_TOKEN_MEMORY, set it in .env.
  bot-memory:
    build: .
    env_file:
      - .env
    environment:
      USE_MEMORY: "True"
      BOT_TOKEN: ${BOT_TOKEN_MEMORY}
      DB_PATH: /app/data/bot_memory.db
    volumes:
      - bot-memory-data:/app/data
    restart: unless-stopped
    networks:
      - telegram-bots-network

volumes:
  # Persists the SQLite database between container restarts/rebuilds.
  bot-memory-data:

networks:
  telegram-bots-network:
    driver: bridge
